# MIMIC-CXR VQA Stage 3 — Full Multi-Task Pretraining
# ============================================
# Stage 3 of the 4-stage curriculum.
# Goal: train the full pipeline end-to-end. All heads receive gradient
# simultaneously, with generation primary and grounding (bbox) heavily
# weighted. SG generator REMAINS FROZEN (Stage 1's output is used as-is).
#
# Loss recipe (from MultiTaskLoss.MODE_WEIGHTS['pretrain']):
#   generation=1.0 (PRIMARY)
#   grounding=2.0 (PRIMARY — bbox regression for visual grounding)
#   vqa=0.05 (aux — classification head)
#   chexpert=0.05 (aux)
#   sg=0.0 (frozen, no gradient)
#
# Resume from Stage 2's trained weights (checkpoint-15000 from Jun 16).
# IMPORTANT: use --reset_scheduler on launch — Stage 2's OneCycleLR cap
# would otherwise abort Stage 3 prematurely.
#
# B-grade pool (per curriculum: B for pretrain stages 1-3).
#
# Usage:
#   torchrun --nproc_per_node=2 train_mimic_cxr.py \
#     --config configs/stage3_pretrain.yaml \
#     --reset_scheduler \
#     --resume_from_checkpoint checkpoints/mimic-cxr-vqa/checkpoint-15000

model:
  visual_backbone: "convnext_base"
  text_encoder: "emilyalsentzer/Bio_ClinicalBERT"
  visual_feature_dim: 512
  scene_graph_dim: 134
  visual_embedding_dim: 646
  hidden_size: 768
  intermediate_size: 3072
  num_hidden_layers: 6
  num_attention_heads: 12
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  sim_layers: 2

  num_regions: 310
  num_entities: 237
  region_embedding_dim: 64
  entity_embedding_dim: 64

  num_binary_classes: 2
  num_category_classes: 14
  num_region_classes: 26
  num_severity_classes: 4

  max_question_length: 128
  vocab_size: 30522

data:
  mimic_cxr_jpg_path: "/root/code/MASTERS-WORK/data/mimic-cxr-jpg"
  mimic_ext_cxr_qba_path: "/root/code/MASTERS-WORK/data/mimic-ext-cxr-qba"
  chexpert_labels_path: ""

  # B-grade pool (last pretraining stage before A-grade finetune in Stage 4)
  quality_grade: "B"
  view_filter: "frontal_only"
  question_types: null

  # Bumped from 250 -> 1000 so a single eval can distinguish runs with
  # better than +/-6pp 95% CI.
  val_samples: 1000

  use_exports: true
  export_grade: "B_frontal"

  cache_dir: ".cache/dataset_samples"

  image_size: 224
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

training:
  output_dir: "./checkpoints/mimic-cxr-vqa-stage3-pretrain"

  # CRITICAL: selects pretrain loss recipe in MultiTaskLoss.MODE_WEIGHTS.
  # Also makes the trainer's freeze_sg_generator logic kick in (Stage 3
  # consumes Stage 1's frozen SG outputs).
  phase: "pretrain"

  batch_size_per_gpu: 2
  gradient_accumulation_steps: 4

  # 2 epochs is the sweet spot for Stage 3:
  # - 1 epoch was enough for Stage 2 to reach gen<1.0
  # - 2 epochs gives all heads (vqa, chex, grd) full sweep over the corpus
  # - Stage 4 finetune on A-grade is where final polish happens
  num_epochs: 2

  # Lower than Stage 2's 5e-5 because:
  # - Stage 2 already brought gen down to ~0.5, near floor
  # - Adding vqa + grounding heads with full weight needs careful LR
  # - Stage 4 will go even lower (1e-5) on A-grade
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_grad_norm: 1.0

  fp16: true
  gradient_checkpointing: false

  # =====================================================
  # STAGE 3 LOSS WEIGHTS — full multi-task
  # =====================================================
  # Resolved automatically by phase="pretrain" in MultiTaskLoss.MODE_WEIGHTS,
  # explicit here for visibility.
  vqa_loss_weight: 0.05
  generation_loss_weight: 1.0       # PRIMARY — Qwen LM
  chexpert_loss_weight: 0.3         # bumped from 0.05; was vestigial.
                                    # Stage 3's CheXpert AUROC oscillated
                                    # 0.50-0.69 because the head got almost
                                    # no gradient. CheXpert is the cleanest
                                    # per-study supervision available.
  scene_graph_loss_weight: 0.0      # SG frozen; no gradient
  grounding_loss_weight: 2.0        # PRIMARY — bbox regression head
  binary_head_weight: 0.1
  category_head_weight: 0.1
  region_head_weight: 0.1
  severity_head_weight: 0.1

  logging_steps: 100
  save_steps: 5000
  save_total_limit: 3
  eval_steps: 2000

  dataloader_num_workers: 2
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 2

  hub_model_id: "KYAGABA/mimic-cxr-vqa-stage3-pretrain"
  hub_private_repo: true
  push_to_hub_strategy: "checkpoint"

  seed: 42

wandb:
  enabled: true
  project: "mimic-cxr-vqa"
  entity: "kyagabajonah"
  name: "stage3-pretrain"
  group: "curriculum"
  tags: ["ssg-vqa", "mimic-cxr", "stage3", "pretrain", "b-grade", "full-multitask"]
  notes: "Stage 3: full multi-task pretrain (gen=1, grd=2 primary). Resumes from Stage 2 checkpoint-15000."
  watch_model: false
  watch_log_freq: 1000
  log_model: true

deepspeed:
  enabled: false
  config_path: "configs/deepspeed_config.json"
  stage: 2
