# MIMIC-CXR VQA Stage 4 — A-grade Finetune
# ============================================
# FINAL stage of the 4-stage curriculum.
# Goal: polish the model on the clean A-grade subset (~7.5M QA pairs)
# with grounding pushed to 3.0× weight for sharper bbox localization.
#
# Loss recipe (from MultiTaskLoss.MODE_WEIGHTS['finetune']):
#   generation=1.0
#   grounding=3.0 (PRIMARY — boosted from Stage 3's 2.0)
#   vqa=0.05 (aux)
#   chexpert=0.05 (aux)
#   sg=0.0 (frozen)
#
# Resume from Stage 3's best_model (pretrain/best_model from Jun 18).
# Use --reset_scheduler so Stage 3's OneCycleLR cap doesn't terminate
# Stage 4 prematurely.
#
# A-grade pool (per curriculum: grade A for finetuning).
#
# Usage:
#   torchrun --nproc_per_node=2 train_mimic_cxr.py \
#     --config configs/stage4_finetune.yaml \
#     --reset_scheduler \
#     --resume_from_checkpoint checkpoints/mimic-cxr-vqa/pretrain/best_model

model:
  # These 12 keys are legacy v1 (ConvNeXt + BioBERT) and are NOT read by the
  # v2 trainer. Kept for historical parity; ignore. The v2-relevant keys are
  # qwen_model_id / use_quantization / lora_rank / lora_alpha /
  # lora_target_modules / num_sg_tokens / num_*_classes.
  visual_backbone: "convnext_base"
  text_encoder: "emilyalsentzer/Bio_ClinicalBERT"
  visual_feature_dim: 512
  scene_graph_dim: 134
  visual_embedding_dim: 646
  hidden_size: 768
  intermediate_size: 3072
  num_hidden_layers: 6
  num_attention_heads: 12
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  sim_layers: 2

  num_regions: 310
  num_entities: 237
  region_embedding_dim: 64
  entity_embedding_dim: 64

  num_binary_classes: 2
  num_category_classes: 14
  num_region_classes: 26
  num_severity_classes: 4

  max_question_length: 128
  vocab_size: 30522

  # V2 LoRA config -- these ARE read by the trainer (via getattr on
  # config.model). Rank 32 + full attention + MLP targets = bigger
  # adaptation surface than the default rank-16 attention-only; still
  # cheap on 48 GB Turing.
  lora_rank: 32
  lora_alpha: 64
  lora_target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

data:
  mimic_cxr_jpg_path: "/root/code/MASTERS-WORK/data/mimic-cxr-jpg"
  mimic_ext_cxr_qba_path: "/root/code/MASTERS-WORK/data/mimic-ext-cxr-qba"
  chexpert_labels_path: ""

  # A+B BLEND for training (was A-only).
  # A-only training on ~76K samples overfit hard (E1 0.464 -> E2 0.336).
  # The B-grade pool includes A (B is "B-or-better"), so setting B here
  # trains on ~106K samples that include the clean A subset. Validation
  # runs on A-only via val_quality_grade below, so we still measure the
  # target distribution but no longer overfit to it.
  quality_grade: "B"
  val_quality_grade: "A"   # only meaningful when train quality != val quality
  view_filter: "frontal_only"
  question_types: null
  # Drop question types that ask about report free-text (indication, history,
  # technique, comparison-with-prior). These confuse a vision model because
  # the answer lives in the report, not the image. Keep C0*, D0*, etc.
  skip_question_types:
    - A_indication
    - A_history
    - A_technique
    - A_comparison

  # Bumped from 250 -> 1000 so a single eval can distinguish runs with
  # better than +/-6pp 95% CI (binomial). Roughly 4x eval wall-clock.
  val_samples: 1000

  use_exports: true
  export_grade: "A_frontal"

  cache_dir: ".cache/dataset_samples"

  image_size: 224
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

training:
  output_dir: "./checkpoints/mimic-cxr-vqa-stage4-finetune"

  # CRITICAL: selects finetune loss recipe (gen=1.0, grd=3.0, vqa=0.05, chex=0.3)
  # Also makes the trainer's freeze_sg_generator logic kick in.
  phase: "finetune"

  batch_size_per_gpu: 2
  gradient_accumulation_steps: 4

  # 1 epoch on A-grade. Was 2; the second epoch overfits hard
  # (Val Acc 0.464 E1 -> 0.384 E2 first eval -> 0.336 E2 final).
  # Combined with EMA + halved LR + tighter eval cadence this should hold
  # the peak instead of degrading past it.
  num_epochs: 1

  # Halved from prior 1e-5. Slower, smoother updates on the cleaner A-grade
  # subset; reduces the late-stage drift that produced the E2 cliff.
  learning_rate: 5.0e-6
  weight_decay: 0.05               # bumped from 0.01 for stronger regularisation
  warmup_ratio: 0.05
  max_grad_norm: 1.0

  fp16: true
  gradient_checkpointing: false

  # EMA decay for the shadow weights used during validation + best-model save.
  # 0.999 -> ~1000-update window, matches typical fine-tune cadence.
  ema_decay: 0.999

  # =====================================================
  # STAGE 4 LOSS WEIGHTS — finetune
  # =====================================================
  # vqa_loss_weight bumped from 0.05 -> 0.15. The classification head
  # (binary/category/region/severity) was starving at 0.05; combined with
  # the earlier metric-routing bug that made Val Binary Acc read 0.0000
  # across all stages, we had no signal that the head was learning at all.
  # 0.15 gives it real gradient without drowning the generation loss.
  vqa_loss_weight: 0.15
  generation_loss_weight: 1.0
  chexpert_loss_weight: 0.3        # bumped from 0.05; was vestigial
                                   # (AUROC oscillated 0.50-0.69 because the
                                   # head got almost no gradient).
  scene_graph_loss_weight: 0.0     # SG frozen
  grounding_loss_weight: 3.0       # PRIMARY -- boosted from Stage 3's 2.0
  # Per-head weights bumped 0.1 -> 0.2 for the priority binary and category
  # heads. ~36% of A-grade pairs are binary; getting that head off 0% is the
  # single largest headline-accuracy lever we have.
  binary_head_weight: 0.2
  category_head_weight: 0.2
  region_head_weight: 0.1
  severity_head_weight: 0.1

  logging_steps: 100
  save_steps: 1000                 # was 3000; finer granularity catches peak
  save_total_limit: 5              # bumped to keep more peak candidates
  eval_steps: 500                  # was 1500; 3x more eval signal to pinpoint
                                   # the true peak before degradation

  dataloader_num_workers: 2
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 2

  hub_model_id: "KYAGABA/mimic-cxr-vqa-stage4-finetune"
  hub_private_repo: true
  push_to_hub_strategy: "checkpoint"

  seed: 42

wandb:
  enabled: true
  project: "mimic-cxr-vqa"
  entity: "kyagabajonah"
  name: "stage4-finetune"
  group: "curriculum"
  tags: ["ssg-vqa", "mimic-cxr", "stage4", "finetune", "a-grade", "final"]
  notes: "Stage 4 FINAL: A-grade finetune (gen=1, grd=3 primary). Resumes from Stage 3 pretrain/best_model."
  watch_model: false
  watch_log_freq: 1000
  log_model: true

deepspeed:
  enabled: false
  config_path: "configs/deepspeed_config.json"
  stage: 2
